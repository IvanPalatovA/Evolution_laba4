<!doctype html><meta charset="utf-8"><title>GP rule tree</title>
<style>body{font:15px Arial;margin:28px;background:#f7f9fc;color:#17212b}ul{padding-left:26px}li{margin:7px}.function{color:#005a9c;font-weight:bold}.variable{color:#238b45}.constant{color:#b35806}code{background:#e9eef4;padding:8px;display:block;white-space:pre-wrap}</style>
<h1>Лучшее эволюционировавшее правило</h1><code>((max(rem_ops, p) / w) / ((1 + w) + min(wait, q_work)))</code><div id=tree></div>
<script>const root={"op_type": "function", "value": "/", "children": [{"op_type": "function", "value": "/", "children": [{"op_type": "function", "value": "max", "children": [{"op_type": "variable", "value": "rem_ops", "children": []}, {"op_type": "variable", "value": "p", "children": []}]}, {"op_type": "variable", "value": "w", "children": []}]}, {"op_type": "function", "value": "+", "children": [{"op_type": "function", "value": "+", "children": [{"op_type": "constant", "value": 1.0, "children": []}, {"op_type": "variable", "value": "w", "children": []}]}, {"op_type": "function", "value": "min", "children": [{"op_type": "variable", "value": "wait", "children": []}, {"op_type": "variable", "value": "q_work", "children": []}]}]}]};function draw(n){let li=document.createElement('li');li.className=n.op_type;li.textContent=n.value;if(n.children.length){let u=document.createElement('ul');n.children.forEach(x=>u.append(draw(x)));li.append(u)}return li}let u=document.createElement('ul');u.append(draw(root));document.querySelector('#tree').append(u);</script>
